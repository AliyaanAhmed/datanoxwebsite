<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <style>
    /* The two dark wedges are ink on a light tab and near white on a dark
       one. A browser tab strip has no background we control, and the mark
       taken straight from the wordmark disappears on half of them. */
    .ink { fill: #1C1A17; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #FFFDFB; }
    }
  </style>
